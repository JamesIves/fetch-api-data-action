name: Integration Tests 🧪
on:
  workflow_call:
    inputs:
      action-ref:
        description: 'The fetch-api-data-action ref (tag, branch, or SHA) to validate.'
        required: false
        type: string
        default: 'v2'
  workflow_dispatch:
    inputs:
      action-ref:
        description: 'The fetch-api-data-action ref (tag, branch, or SHA) to validate.'
        required: false
        type: string
        default: 'v2'
  schedule:
    - cron: 30 15 * * 0-6
jobs:
  refresh-api-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/fetch-api-data-action
          ref: ${{ inputs.action-ref || 'v2' }}
          path: action-under-test
          persist-credentials: false

      - name: Fetch UTF8 Data 📦
        id: validate
        uses: ./action-under-test
        with:
          endpoint: https://jsonplaceholder.typicode.com/todos/1
          save-location: fetch-api-data-custom
          save-name: todo
          retry: true

      - name: Access environment variable output
        run: |
          echo "${fetchApiData}"

      - name: Access step output
        run: |
          echo "Output: ${{ steps.validate.outputs.fetchApiData }}"

      - name: Build and Deploy Repo 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: fetch-api-data-custom
          target-folder: data
          ssh-key: ${{ secrets.DEPLOY_KEY }}
